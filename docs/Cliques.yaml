components:
  schemas:
    User:
      type: object
      properties:
        id:
          type: integer
          examples: [68]
        username:
          type: string
          examples: ["QueenOfYasss"]
        email:
          type: string
          examples: ["johnDoe@gmail.com"]
        creationDate:
          type: string
          format: date-time
          examples: ["2026-09-22T20:18:54Z"]
        userBirthday:
          type: string
          format: date
          examples: ["2026-09-22"]
        warningStatus:
          type: boolean
          examples: [true]
        lastMessage:
          type: string
          format: date-time
          examples: ["2026-09-22T20:23:06Z"]

    Group:
      type: object
      properties:
        id:
          type: integer
          examples: [90]
        name:
          type: string
          examples: ["Knights of Wonky Table"]
        creationDate:
          type: string
          format: date-time
          examples: ["2026-09-22T20:23:06Z"]
        memberCount:
          type: integer
          examples: [5]
        adultGate:
          type: boolean
          examples: [false]
        lastMessage:
          type: string
          format: date-time
          examples: ["2026-09-22T20:23:06Z"]
        memberships:
          type: array
          items:
            type: integer
          examples: [16, 108, 2067, 908817]

    Membership:
      type: object
      properties:
        userId:
          type: integer
          examples: [54]
        groupId:
          type: integer
          examples: [62]
        channelId:
          type: integer
          examples: [905]
        modStatus:
          type: boolean
          examples: [true]
        joinDate:
          type: string
          format: date-time
          examples: ["2026-09-22T20:23:06Z"]
        leaveDate:
          type: string
          format: date-time
          examples: ["2026-09-22T20:23:06Z"]

    Channel:
      type: object
      properties:
        id:
          type: integer
          examples: [207]
        groupId:
          type: integer
          examples: [451]
        memberships:
          type: array
          items:
            type: integer
          examples: [16, 108, 2067, 908817]
        lastMessage:
          type: string
          format: date-time
          examples: ["2026-09-22T20:23:06Z"]
        adultGate:
          type: boolean
          examples: [false]

    Message:
      type: object
      properties:
        id:
          type: integer
          examples: [2098019652193]
        body:
          type: string
          examples: ["😂"]
        sendDate:
          type: string
          format: date-time
          examples: ["2026-09-22T20:23:06Z"]
        senderId:
          type: integer
          examples: [654]
        channelId:
          type: integer
          examples: [237]
        edited:
          type: boolean
          examples: [false]

