      responses:
        "200":
          description: Message updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
    delete:
      summary: Delete a message
      parameters:
        - name: id
          in: query
          required: true
          schema:
            type: integer
            examples: [1024]
      responses:
        "204":
          description: Message deleted

  /messages/{id}:
    get:
      summary: Get a message by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            examples: [65]
      responses:
        "200":
          description: A single message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "404":
          description: Message not found

