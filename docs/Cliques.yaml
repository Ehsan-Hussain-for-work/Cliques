openapi: 3.1.0
info:
  title: Cliques
  description: Chatroom Web Service
  version: 0.2.0
servers:
  - url: "https://localhost:8080/api/v0.2"
    description: Local Development Server

paths:
  /users:
    get:
      summary: Get a list of all users
      description: Retrieves a list of users. Can be filtered by id, name, warning flag, etc.
      parameters:
        - name: username
          in: query
          description: Filter users by username (partial match)
          required: false
          schema:
            type: string
            examples: ["QueenOfYasss"]
        - name: email
          in: query
          description: Filter users by email
          required: false
          schema:
            type: string
            examples: ["johnDoe@gmail.com"]
        - name: creationDate
          in: query
          description: Filter users by the time they first registered
          required: false
          schema:
            type: string
            examples: ["2026-09-22T20:18:54Z"]
        - name: userBirthday
          in: query
          description: Filter users by their registered birthday
          required: false
          schema:
            type: string
            examples: ["2000-01-01"]
        - name: warningStatus
          in: query
          description: Filter users by warning flag
          required: false
          schema:
            type: boolean
            examples: [true]
        - name: page
          in: query
          description: Filter users by subset of queries in the db
          required: false
          schema:
            type: integer
            examples: [1,2,3,4,5]
        - name: limit
          in: query
          description: Filter the amount of users in a page
          required: false
          schema:
            type: integer
            examples: [10]
            default: 5
      responses:
        "200":
          description: A JSON array of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
        "404":
          description: User not found
    post:
      summary: Create a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/User"
      responses:
        "201":
          description: User created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: Invalid input
    put:
      summary: Update an existing user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/User"
      responses:
        "200":
          description: User updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "404":
          description: User not found
    delete:
      summary: Delete a user
      parameters:
        - name: id
          in: query
          required: true
          description: ID of the user to delete
          schema:
            type: integer
            examples: [68]
      responses:
        "204":
          description: User deleted
        "404":
          description: User not found

  /users/{id}:
    get:
      summary: Get a user by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            examples: [68]
      responses:
        "200":
          description: A single user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "404":
          description: User not found

