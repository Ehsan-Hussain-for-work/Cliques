            examples: [10]
            default: 5
      responses:
        "200":
          description: A JSON array of groups
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Group"
    post:
      summary: Create a new group
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Group"
      responses:
        "201":
          description: Group created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Group"
    put:
      summary: Update an existing group
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Group"
      responses:
        "200":
          description: Group updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Group"
    delete:
      summary: Delete a group
      parameters:
        - name: id
          in: query
          required: true
          schema:
            type: integer
            examples: [90]
      responses:
        "204":
          description: Group deleted

  /groups/{id}:
    get:
      summary: Get a group by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            examples: [66]
      responses:
        "200":
          description: A single group
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Group"
        "404":
          description: Group not found

  /messages:
    get:
      summary: Get a subset of messages
      parameters:
        - name: senderId
          in: query
          description: Filter messages by sender
          required: false
          schema:
            type: integer
            examples: [654]
        - name: channelId
          in: query
          description: Filter messages by which channel they were sent to
          required: false
          schema:
            type: integer
            examples: [42]
        - name: page
          in: query
          description: Filter messages by subset of queries in the db
          required: true
          schema:
            type: integer
            examples: [1,2,3,4,5]
        - name: limit
          in: query
          description: Filter the amount of messages in a page
          required: false
          schema:
            type: integer
            examples: [10]
            default: 5
      responses:
        "200":
          description: A JSON array of messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Message"
    post:
      summary: Create a new message
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Message"
      responses:
        "201":
          description: Message created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
    put:
      summary: Update an existing message
      requestBody:
        required: true
        content:
