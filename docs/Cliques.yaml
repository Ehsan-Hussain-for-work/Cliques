components:
  schemas:
    User:
      type: object
      xml:
        name: user
      properties:
        id:
          type: integer
          examples: [68]
        username:
          type: string
          examples: ["QueenOfYasss"]
        email:
          type: string
          examples: ["johnDoe@gmail.com"]
        creationDate:
          type: string
          format: date-time
          examples: ["2026-09-22T20:18:54Z"]
        userBirthday:
          type: string
          format: date
          examples: ["2026-09-22"]
        warningStatus:
          type: boolean
          examples: [true]
        lastMessage:
          type: string
          format: date-time
          examples: ["2026-09-22T20:23:06Z"]

    Group:
      type: object
      xml:
        name: group
      properties:
        id:
          type: integer
          examples: [90]
        name:
          type: string
          examples: ["Knights of Wonky Table"]
        creationDate:
          type: string
          format: date-time
          examples: ["2026-09-22T20:23:06Z"]
        memberCount:
          type: integer
          examples: [5]
        adultGate:
          type: boolean
          examples: [false]
        lastMessage:
          type: string
          format: date-time
          examples: ["2026-09-22T20:23:06Z"]
        memberships:
          type: array
          items:
            type: integer
          examples: [[16, 108, 2067, 908817]]

    Channel:
      type: object
      xml:
        name: channel
      properties:
        id:
          type: integer
          examples: [207]
        groupId:
          type: integer
          examples: [451]
        memberships:
          type: array
          items:
            type: integer
          examples: [[16, 108, 2067, 908817]]
        lastMessage:
          type: string
          format: date-time
          examples: ["2026-09-22T20:23:06Z"]
        adultGate:
          type: boolean
          examples: [false]

    Message:
      type: object
      xml:
        name: message
      properties:
        id:
          type: integer
          examples: [2098019652193]
        body:
          type: string
          examples: ["😂"]
        sendDate:
          type: string
          format: date-time
          examples: ["2026-09-22T20:23:06Z"]
        senderId:
          type: integer
          examples: [654]
        channelId:
          type: integer
          examples: [237]
        edited:
          type: boolean
          examples: [false]

    Page:
      type: object
      properties:
        number:
          type: integer
          examples: [1]
        perPage:
          type: integer
          examples: [10]
        returned:
          type: integer
          examples: [10]
        totalItems:
          type: integer
          examples: [17]
        totalPages:
          type: integer
          examples: [2]

    Links:
      type: object
      properties:
        self:
          type: string
          examples: ["/users?sort=id&page=1&limit=10"]
        next:
          type: ["string", "null"]
          examples: ["/users?sort=id&page=2&limit=10"]
        prev:
          type: ["string", "null"]
          examples: [null]

    UserCollection:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/User"
        page:
          $ref: "#/components/schemas/Page"
        links:
          $ref: "#/components/schemas/Links"

    GroupCollection:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Group"
        page:
          $ref: "#/components/schemas/Page"
        links:
          $ref: "#/components/schemas/Links"

    ChannelCollection:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Channel"
        page:
          $ref: "#/components/schemas/Page"
        links:
          $ref: "#/components/schemas/Links"

    MessageCollection:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Message"
        page:
          $ref: "#/components/schemas/Page"
        links:
          $ref: "#/components/schemas/Links"

    ErrorResponse:
      type: object
      required:
        - type
        - title
        - status
        - detail
      properties:
        type:
          type: string
          examples: ["about:blank"]
        title:
          type: string
          examples: ["Not Acceptable"]
        status:
          description: A code associated with the nature of the error.
          type: integer
          examples: [406]
        detail:
          description: A message explaining the encountered error.
          type: string
          examples: ["No acceptable success format."]
        instance:
          description: The endpoint being requested when the error was encountered.
          type: string
          examples: ["/cliques-lia/channels"]
        requestId:
          description: The id associated with the request.
          type: string
          examples: ["15734abdaecd2c2c8b28c52bdca9646c"]

  responses:
    BadRequest:
      description: The request contains invalid parameters or malformed data.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            statusCode: 400
            error:
              type: BAD_REQUEST
              description: The request contains invalid or malformed information.

    ResourceNotFound:
      description: The requested resource does not exist.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            statusCode: 404
            error:
              type: RESOURCE_NOT_FOUND
              description: The requested resource does not exist.

    MethodNotAllowed:
      description: The HTTP method is not supported by this endpoint.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            statusCode: 405
            error:
              type: NOT_ALLOWED
              description: The requested HTTP method is not allowed.

    NotAcceptable:
      description: The requested response representation is not supported.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            statusCode: 406
            error:
              type: NOT_ACCEPTABLE
              description: >
                The Accept header requests a representation this endpoint
                does not support. Supported representations for this
                endpoint are listed in its 200 response content map.

    ServerError:
      description: An unexpected server-side error occurred.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            statusCode: 500
            error:
              type: SERVER_ERROR
              description: An internal error has occurred while processing your request.

