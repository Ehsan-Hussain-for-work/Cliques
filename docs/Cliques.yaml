  /channels:
    get:
      summary: Get a list of all channels
      parameters:
        - name: groupId
          in: query
          description: Filter channels based on which group they belong to
          required: false
          schema:
            type: integer
            example: 3
        - name: adultGate
          in: query
          description: Filter channels by adult gate flag
          required: false
          schema:
            type: boolean
            example: false
      responses:
        "200":
          description: A JSON array of channels
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Channel"
    post:
      summary: Create a new channel
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Channel"
      responses:
        "201":
          description: Channel created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Channel"
    put:
      summary: Update an existing channel
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Channel"
      responses:
        "200":
          description: Channel updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Channel"
    delete:
      summary: Delete a channel
      parameters:
        - name: id
          in: query
          required: true
          schema:
            type: integer
            example: 207
      responses:
        "204":
          description: Channel deleted

