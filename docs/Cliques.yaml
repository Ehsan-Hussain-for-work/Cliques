  /channels:
    get:
      summary: Get a list of all channels
      parameters:
        - name: groupId
          in: query
          description: Filter channels based on which group they belong to
          required: false
          schema:
            type: integer
            examples: [3]
        - name: adultGate
          in: query
          description: Filter channels by adult gate flag
          required: false
          schema:
            type: boolean
            examples: [false]
        - name: page
          in: query
          description: Filter channels by subset of queries in the db
          required: false
          schema:
            type: integer
            examples: [1, 2, 3, 4, 5]
        - name: limit
          in: query
          description: Filter the amount of channels in a page
          required: false
          schema:
            type: integer
            examples: [10]
            default: 5
      responses:
        "200":
