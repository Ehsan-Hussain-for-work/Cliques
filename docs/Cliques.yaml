    delete:
      summary: Delete a group
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            examples: [90]
      responses:
        "204":
          description: Group deleted
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          $ref: "#/components/responses/ServerError"

  /messages:
    get:
      summary: Get a subset of messages
      parameters:
        - name: senderId
          in: query
          description: Filter messages by sender
          required: false
          schema:
            type: integer
            examples: [654]
        - name: channelId
          in: query
          description: Filter messages by which channel they were sent to
          required: false
          schema:
            type: integer
            examples: [42]
        - name: page
          in: query
          description: Filter messages by subset of queries in the db
          required: true
          schema:
            type: integer
            examples: [1, 2, 3, 4, 5]
        - name: limit
          in: query
          description: Filter the amount of messages in a page
          required: false
          schema:
            type: integer
            examples: [10]
            default: 5
      responses:
        "200":
          description: A JSON array of messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Message"
        "400":
          $ref: "#/components/responses/BadRequest"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "406":
          $ref: "#/components/responses/NotAcceptable"
        "500":
          $ref: "#/components/responses/ServerError"

    post:
      summary: Create a new message
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Message"
      responses:
