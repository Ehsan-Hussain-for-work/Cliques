components:
  schemas:
    User:
      type: object
      properties:
        id:
          type: integer
          examples: [68]
        username:
          type: string
          examples: ["QueenOfYasss"]
        email:
          type: string
          examples: ["johnDoe@gmail.com"]
        creationDate:
          type: string
          format: date-time
          examples: ["2026-09-22T20:18:54Z"]
        userBirthday:
          type: string
          format: date
          examples: ["2026-09-22"]
        warningStatus:
          type: boolean
          examples: [true]
        lastMessage:
          type: string
          format: date-time
          examples: ["2026-09-22T20:23:06Z"]

    Group:
      type: object
      properties:
        id:
          type: integer
          examples: [90]
        name:
          type: string
          examples: ["Knights of Wonky Table"]
        creationDate:
          type: string
          format: date-time
          examples: ["2026-09-22T20:23:06Z"]
        memberCount:
          type: integer
          examples: [5]
        adultGate:
          type: boolean
          examples: [false]
        lastMessage:
          type: string
          format: date-time
          examples: ["2026-09-22T20:23:06Z"]
        memberships:
          type: array
          items:
            type: integer
          examples: [[16, 108, 2067, 908817]]

    Membership:
      type: object
      properties:
        userId:
          type: integer
          examples: [54]
        groupId:
          type: integer
          examples: [62]
        channelId:
          type: integer
          examples: [905]
        modStatus:
          type: boolean
          examples: [true]
        joinDate:
          type: string
          format: date-time
          examples: ["2026-09-22T20:23:06Z"]
        leaveDate:
          type: string
          format: date-time
          examples: ["2026-09-22T20:23:06Z"]

    Channel:
      type: object
      properties:
        id:
          type: integer
          examples: [207]
        groupId:
          type: integer
          examples: [451]
        memberships:
          type: array
          items:
            type: integer
          examples: [[16, 108, 2067, 908817]]
        lastMessage:
          type: string
          format: date-time
          examples: ["2026-09-22T20:23:06Z"]
        adultGate:
          type: boolean
          examples: [false]

    Message:
      type: object
      properties:
        id:
          type: integer
          examples: [2098019652193]
        body:
          type: string
          examples: ["😂"]
        sendDate:
          type: string
          format: date-time
          examples: ["2026-09-22T20:23:06Z"]
        senderId:
          type: integer
          examples: [654]
        channelId:
          type: integer
          examples: [237]
        edited:
          type: boolean
          examples: [false]

    ErrorResponse:
      type: object
      required:
        - statusCode
        - error
      properties:
        statusCode:
          type: integer
          description: HTTP status code associated with the error.
          examples: [404]

        error:
          type: object
          required:
            - type
            - description
          properties:
            type:
              type: string
              description: Classification of the error.
              enum:
                - BAD_REQUEST
                - INSUFFICIENT_PRIVILEGES
                - NOT_ALLOWED
                - NOT_IMPLEMENTED
                - RESOURCE_NOT_FOUND
                - SERVER_ERROR
                - UNAUTHENTICATED
                - VALIDATION_ERROR
                - VERIFICATION_ERROR
              examples: ["RESOURCE_NOT_FOUND"]

            description:
              type:
                - string
                - "null"
              description: Explanation of what caused the error.
              examples:
                - "The user you requested does not exist."

  responses:
    BadRequest:
      description: The request contains invalid parameters or malformed data.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            statusCode: 400
            error:
              type: BAD_REQUEST
              description: The request contains invalid or malformed information.

    ResourceNotFound:
      description: The requested resource does not exist.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            statusCode: 404
            error:
              type: RESOURCE_NOT_FOUND
              description: The requested resource does not exist.

    MethodNotAllowed:
      description: The HTTP method is not supported by this endpoint.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            statusCode: 405
            error:
              type: NOT_ALLOWED
              description: The requested HTTP method is not allowed.

    ServerError:
      description: An unexpected server-side error occurred.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            statusCode: 500
            error:
              type: SERVER_ERROR
              description: An internal error has occurred while processing your request.

    # Unauthorized:
    #   description: Authentication is required or invalid.
    #   content:
    #     application/json:
    #       schema:
    #         $ref: "#/components/schemas/ErrorResponse"

    # Forbidden:
    #   description: The client has sufficient privileges.
    #   content:
    #     application/json:
    #       schema:
    #         $ref: "#/components/schemas/ErrorResponse"

    # NotAcceptable:
    #   description: The response format is unsupported.
    #   content:
    #     application/json:
    #       schema:
    #         $ref: "#/components/schemas/ErrorResponse"

    # Conflict:
    #   description: The operation conflicts with registered data.
    #   content:
    #     application/json:
    #       schema:
    #         $ref: "#/components/schemas/ErrorResponse"

    # ValidationError:
    #   description: The data failed to validate.
    #   content:
    #     application/json:
    #       schema:
    #         $ref: "#/components/schemas/ErrorResponse"

    # NotImplemented:
    #   description: The functionality is not implemented.
    #   content:
    #     application/json:
    #       schema:
    #         $ref: "#/components/schemas/ErrorResponse"
