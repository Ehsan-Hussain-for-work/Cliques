    get:
      summary: Get a channel by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            example: 64
      responses:
        "200":
          description: A single channel
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Channel"
        "404":
          description: Channel not found

  /memberships:
    get:
      summary: Get a list of all memberships
      parameters:
        - name: groupId
          in: query
          description: Filter memberships by group
          required: false
          schema:
            type: integer
            example: 62
        - name: channelId
          in: query
          description: Filter memberships by channel
          required: false
          schema:
            type: integer
            example: 61
      responses:
        "200":
          description: A JSON array of memberships
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Membership"
    post:
      summary: Create a new membership
      requestBody:
        required: true
        content:
