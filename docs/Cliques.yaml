openapi: 3.1.0
info:
  title: Cliques
  description: Chatroom Web Service
  version: 0.2.0
servers:
  - url: "https://localhost:8080/api/v0.2"
    description: Local Development Server

paths:
  /users:
    get:
      summary: Get a list of all users
      description: Retrieves a list of users. Can be filtered by id, name, warning flag, etc.
      parameters:
        - name: username
          in: query
          description: Filter users by username (partial match)
          required: false
          schema:
            type: string
            examples: ["QueenOfYasss"]
        - name: email
          in: query
          description: Filter users by email
          required: false
          schema:
            type: string
            examples: ["johnDoe@gmail.com"]
        - name: creationDate
          in: query
          description: Filter users by the time they first registered
          required: false
          schema:
            type: string
            examples: ["2026-09-22T20:18:54Z"]
        - name: userBirthday
          in: query
          description: Filter users by their registered birthday
          required: false
          schema:
            type: string
            examples: ["2000-01-01"]
        - name: warningStatus
          in: query
          description: Filter users by warning flag
          required: false
          schema:
            type: boolean
            examples: [true]
        - name: page
          in: query
          description: Filter users by subset of queries in the db
          required: false
          schema:
            type: integer
            examples: [1, 2, 3, 4, 5]
        - name: limit
          in: query
          description: Filter the amount of users in a page
          required: false
          schema:
            type: integer
            examples: [10]
            default: 5
      responses:
        "200":
          description: Successfully retrieved users.
          content:
            application/json:
              schema:
                type: object
                description: Paginated collection of users.

        "400":
          $ref: "#/components/responses/BadRequest"

        "405":
          $ref: "#/components/responses/MethodNotAllowed"

        "500":
          $ref: "#/components/responses/ServerError"

    post:
      summary: Create a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/User"
      responses:
        "201":
          description: User created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

        "400":
          $ref: "#/components/responses/BadRequest"

        "405":
          $ref: "#/components/responses/MethodNotAllowed"

        "500":
          $ref: "#/components/responses/ServerError"

        # "409":
        #   $ref: "#/components/responses/Conflict"

    put:
      summary: Update an existing user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/User"
      responses:
        "200":
          description: User updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

        "400":
          $ref: "#/components/responses/BadRequest"

        "404":
          $ref: "#/components/responses/ResourceNotFound"

        "405":
          $ref: "#/components/responses/MethodNotAllowed"

        "500":
          $ref: "#/components/responses/ServerError"
    delete:
      summary: Delete a user
      parameters:
        - name: id
          in: query
          required: true
          description: ID of the user to delete
          schema:
            type: integer
            examples: [68]
      responses:
        "204":
          description: User successfully deleted.

        "400":
          $ref: "#/components/responses/BadRequest"

        "404":
          $ref: "#/components/responses/ResourceNotFound"

        "405":
          $ref: "#/components/responses/MethodNotAllowed"

        "500":
          $ref: "#/components/responses/ServerError"

  /users/{id}:
    get:
      summary: Get a user by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            examples: [68]
      responses:
        "200":
          description: Successfully retrieved user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

        "400":
          $ref: "#/components/responses/BadRequest"

        "404":
          $ref: "#/components/responses/ResourceNotFound"

        "405":
          $ref: "#/components/responses/MethodNotAllowed"

        "500":
          $ref: "#/components/responses/ServerError"

  /groups:
    get:
      summary: Get a list of all groups
      parameters:
        - name: name
          in: query
          description: Filter groups by name (partial match)
          required: false
          schema:
            type: string
            examples: ["Knights"]
        - name: creationDate
          in: query
          description: Filter groups by the date they were created
          required: false
          schema:
            type: string
            examples: ["2026-10-22T20:18:54Z"]
        - name: page
          in: query
          description: Filter groups by subset of queries in the db
          required: false
          schema:
            type: integer
            examples: [1, 2, 3, 4, 5]
        - name: limit
          in: query
          description: Filter the amount of groups in a page
          required: false
          schema:
            type: integer
            examples: [10]
            default: 5
      responses:
        "200":
          description: Successfully retrieved groups.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Group"

        "400":
          $ref: "#/components/responses/BadRequest"

        "405":
          $ref: "#/components/responses/MethodNotAllowed"

        "500":
          $ref: "#/components/responses/ServerError"

    post:
      summary: Create a new group
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Group"
      responses:
        "201":
          description: Group created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Group"
    put:
      summary: Update an existing group
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Group"
      responses:
        "200":
          description: Group updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Group"
    delete:
      summary: Delete a group
      parameters:
        - name: id
          in: query
          required: true
          schema:
            type: integer
            examples: [90]
      responses:
        "204":
          description: Group deleted

  /groups/{id}:
    get:
      summary: Get a group by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            examples: [66]
      responses:
        "200":
          description: Successfully retrieved group.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Group"

        "400":
          $ref: "#/components/responses/BadRequest"

        "404":
          $ref: "#/components/responses/ResourceNotFound"

        "405":
          $ref: "#/components/responses/MethodNotAllowed"

        "500":
          $ref: "#/components/responses/ServerError"

  /messages:
    get:
      summary: Get a subset of messages
      parameters:
        - name: senderId
          in: query
          description: Filter messages by sender
          required: false
          schema:
            type: integer
            examples: [654]
        - name: channelId
          in: query
          description: Filter messages by which channel they were sent to
          required: false
          schema:
            type: integer
            examples: [42]
        - name: page
          in: query
          description: Filter messages by subset of queries in the db
          required: true
          schema:
            type: integer
            examples: [1, 2, 3, 4, 5]
        - name: limit
          in: query
          description: Filter the amount of messages in a page
          required: false
          schema:
            type: integer
            examples: [10]
            default: 5
      responses:
        "200":
          description: A JSON array of messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Message"
    post:
      summary: Create a new message
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Message"
      responses:
        "201":
          description: Message created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
    put:
      summary: Update an existing message
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Message"
      responses:
        "200":
          description: Message updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
    delete:
      summary: Delete a message
      parameters:
        - name: id
          in: query
          required: true
          schema:
            type: integer
            examples: [1024]
      responses:
        "204":
          description: Message deleted

  /messages/{id}:
    get:
      summary: Get a message by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            examples: [65]
      responses:
        "200":
          description: A single message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "404":
          description: Message not found

  /channels:
    get:
      summary: Get a list of all channels
      parameters:
        - name: groupId
          in: query
          description: Filter channels based on which group they belong to
          required: false
          schema:
            type: integer
            examples: [3]
        - name: adultGate
          in: query
          description: Filter channels by adult gate flag
          required: false
          schema:
            type: boolean
            examples: [false]
        - name: page
          in: query
          description: Filter channels by subset of queries in the db
          required: false
          schema:
            type: integer
            examples: [1, 2, 3, 4, 5]
        - name: limit
          in: query
          description: Filter the amount of channels in a page
          required: false
          schema:
            type: integer
            examples: [10]
            default: 5
      responses:
        "200":
          description: A JSON array of channels
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Channel"
    post:
      summary: Create a new channel
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Channel"
      responses:
        "201":
          description: Channel created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Channel"
    put:
      summary: Update an existing channel
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Channel"
      responses:
        "200":
          description: Channel updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Channel"
    delete:
      summary: Delete a channel
      parameters:
        - name: id
          in: query
          required: true
          schema:
            type: integer
            examples: [207]
      responses:
        "204":
          description: Channel deleted

  /channels/{id}:
    get:
      summary: Get a channel by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            examples: [64]
      responses:
        "200":
          description: Successfully retrieved channel.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Channel"

        "400":
          $ref: "#/components/responses/BadRequest"

        "404":
          $ref: "#/components/responses/ResourceNotFound"

        "405":
          $ref: "#/components/responses/MethodNotAllowed"

        "500":
          $ref: "#/components/responses/ServerError"

  /memberships:
    get:
      summary: Get a list of all memberships
      parameters:
        - name: groupId
          in: query
          description: Filter memberships by group
          required: false
          schema:
            type: integer
            examples: [62]
        - name: userId
          in: query
          description: Filter memberships by users
          required: false
          schema:
            type: integer
            examples: [61]
        - name: page
          in: query
          description: Filter memberships by subset of queries in the db
          required: false
          schema:
            type: integer
            examples: [1, 2, 3, 4, 5]
        - name: limit
          in: query
          description: Filter the amount of memberships in a page
          required: false
          schema:
            type: integer
            examples: [10]
            default: 5
      responses:
        "200":
          description: A JSON array of memberships
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Membership"
    post:
      summary: Create a new membership
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Membership"
      responses:
        "201":
          description: Membership created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Membership"
    put:
      summary: Update an existing membership
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Membership"
      responses:
        "200":
          description: Membership updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Membership"

