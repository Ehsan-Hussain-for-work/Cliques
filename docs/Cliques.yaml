openapi: 3.1.0
info:
  title: Cliques
  description: Chatroom Web Service
  version: 0.1.0
servers:
  - url: "https://localhost:8080/api/v0.1"
    description: Local Development Server

paths:
  /users:
    get:
      summary: Get a list of all users
      description: Retrieves a list of users. Can be filtered by id, name, warning flag, etc.
      parameters:
        - name: username
          in: query
          description: Filter users by username (partial match)
          required: false
          schema:
            type: string
            example: "QueenOfYasss"
        - name: email
          in: query
          description: Filter users by email
          required: false
          schema:
            type: string
            example: "johnDoe@gmail.com"
        - name: creationDate
          in: query
          description: Filter users by the time they first registered
          required: false
          schema:
            type: string
            example: "2026-09-22T20:18:54Z"
        - name: userBirthday
          in: query
          description: Filter users by their registered birthday
          required: false
          schema:
            type: string
            example: "2000-01-01"
        - name: warningStatus
          in: query
          description: Filter users by warning flag
          required: false
          schema:
            type: boolean
            example: true
      responses:
        "200":
          description: A JSON array of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
        "404":
          description: User not found
    post:
      summary: Create a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/User"
      responses:
        "201":
          description: User created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: Invalid input
    put:
      summary: Update an existing user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/User"
      responses:
        "200":
          description: User updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "404":
          description: User not found
    delete:
      summary: Delete a user
      parameters:
        - name: id
          in: query
          required: true
          description: ID of the user to delete
          schema:
            type: integer
            example: 68
      responses:
        "204":
          description: User deleted
        "404":
          description: User not found

  /users/{id}:
    get:
      summary: Get a user by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            example: 68
      responses:
        "200":
          description: A single user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "404":
          description: User not found

  /groups:
    get:
      summary: Get a list of all groups
      parameters:
        - name: name
          in: query
          description: Filter groups by name (partial match)
          required: false
          schema:
            type: string
            example: "Knights"
        - name: creationDate
          in: query
          description: Filter groups by the date they were created
          required: false
          schema:
            type: string
            example: "2026-10-22T20:18:54Z"
      responses:
        "200":
          description: A JSON array of groups
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Group"
    post:
      summary: Create a new group
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Group"
      responses:
        "201":
          description: Group created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Group"
    put:
      summary: Update an existing group
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Group"
      responses:
        "200":
          description: Group updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Group"
    delete:
      summary: Delete a group
      parameters:
        - name: id
          in: query
          required: true
          schema:
            type: integer
            example: 90
      responses:
        "204":
          description: Group deleted

  /groups/{id}:
    get:
      summary: Get a group by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            example: 66
      responses:
        "200":
          description: A single group
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Group"
        "404":
          description: Group not found

  /messages:
    get:
      summary: Get a list of all messages
      parameters:
        - name: senderId
          in: query
          description: Filter messages by sender
          required: false
          schema:
            type: integer
            example: 654
        - name: channelId
          in: query
          description: Filter messages by which channel they were sent to
          required: false
          schema:
            type: integer
            example: 42
      responses:
        "200":
          description: A JSON array of messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Message"
    post:
      summary: Create a new message
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Message"
      responses:
        "201":
          description: Message created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
    put:
      summary: Update an existing message
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Message"
      responses:
        "200":
          description: Message updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
    delete:
      summary: Delete a message
      parameters:
        - name: id
          in: query
          required: true
          schema:
            type: integer
            example: 1024
      responses:
        "204":
          description: Message deleted

  /messages/{id}:
    get:
      summary: Get a message by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            example: 65
      responses:
        "200":
          description: A single message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "404":
          description: Message not found

