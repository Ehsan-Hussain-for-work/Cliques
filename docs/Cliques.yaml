components:
  schemas:
    User:
      type: object
      properties:
        id:
          type: integer
          example: 68
        username:
          type: string
          example: "QueenOfYasss"
        email:
          type: string
          example: "johnDoe@gmail.com"
        creationDate:
          type: string
          format: date-time
          example: "2026-09-22T20:18:54Z"
        userBirthday:
          type: string
          format: date
          example: "2026-09-22"
        warningStatus:
          type: boolean
          example: true
        lastMessage:
          type: string
          format: date-time
          example: "2026-09-22T20:23:06Z"

    Group:
      type: object
      properties:
        id:
          type: integer
          example: 90
        name:
          type: string
          example: "Knights of Wonky Table"
        creationDate:
          type: string
          format: date-time
          example: "2026-09-22T20:23:06Z"
        memberCount:
          type: integer
          example: 5
        adultGate:
          type: boolean
          example: false
        lastMessage:
          type: string
          format: date-time
          example: "2026-09-22T20:23:06Z"
        memberships:
          type: array
          items:
            type: integer
          example: [16, 108, 2067, 908817]

    Membership:
      type: object
      properties:
        userId:
          type: integer
          example: 54
        groupId:
          type: integer
          example: 62
        channelId:
          type: integer
          example: 905
        modStatus:
          type: boolean
          example: true
        joinDate:
          type: string
          format: date-time
          example: "2026-09-22T20:23:06Z"
        leaveDate:
          type: string
          format: date-time
          example: "2026-09-22T20:23:06Z"

    Channel:
      type: object
      properties:
        id:
          type: integer
          example: 207
        groupId:
          type: integer
          example: 451
        memberships:
          type: array
          items:
            type: integer
          example: [16, 108, 2067, 908817]
        lastMessage:
          type: string
          format: date-time
          example: "2026-09-22T20:23:06Z"
        adultGate:
          type: boolean
          example: false

    Message:
      type: object
      properties:
        id:
          type: integer
          example: 2098019652193
        body:
          type: string
          example: "😂"
        sendDate:
          type: string
          format: date-time
          example: "2026-09-22T20:23:06Z"
        senderId:
          type: integer
          example: 654
        channelId:
          type: integer
          example: 237
        edited:
          type: boolean
          example: false

