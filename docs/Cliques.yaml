openapi: 3.1.0
info:
  title: Cliques
  description: Chatroom Web Service
  version: 0.3.0
servers:
  - url: "https://localhost:8080/cliques-lia"
    description: Local Development Server

paths:
  /users:
    get:
      summary: Get a list of all users
      description: >
        Retrieves a paginated collection of users. Supports JSON (default),
        XML, and YAML response representations via the Accept header.
      parameters:
        - name: username
          in: query
          description: Filter users by username (partial match)
          required: false
          schema:
            type: string
            examples: ["QueenOfYasss"]
        - name: email
          in: query
          description: Filter users by email
          required: false
          schema:
            type: string
            examples: ["johnDoe@gmail.com"]
        - name: creationDate
          in: query
          description: Filter users by the time they first registered
          required: false
          schema:
            type: string
            examples: ["2026-09-22T20:18:54Z"]
        - name: userBirthday
          in: query
          description: Filter users by their registered birthday
          required: false
          schema:
            type: string
            examples: ["2000-01-01"]
        - name: warningStatus
          in: query
          description: Filter users by warning flag
          required: false
          schema:
            type: boolean
            examples: [true]
        - name: page
          in: query
          description: Filter users by subset of queries in the db
          required: false
          schema:
            type: integer
            examples: [1, 2, 3, 4, 5]
        - name: limit
          in: query
          description: Filter the amount of users in a page
          required: false
          schema:
            type: integer
            examples: [10]
            default: 5
      responses:
        "200":
          description: Successfully retrieved users.
          headers:
            Vary:
              description: Indicates that the response varies by the Accept header.
              schema:
                type: string
                examples: ["Accept"]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserCollection"
            application/xml:
              schema:
                $ref: "#/components/schemas/UserCollection"
            application/yaml:
              schema:
                $ref: "#/components/schemas/UserCollection"
        "400":
          $ref: "#/components/responses/BadRequest"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "406":
          $ref: "#/components/responses/NotAcceptable"
        "500":
          $ref: "#/components/responses/ServerError"

    post:
      summary: Create a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/User"
      responses:
        "201":
          description: User created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          $ref: "#/components/responses/ServerError"

  /users/{id}:
    get:
      summary: Get a user by ID
      description: >
        Returns a single user. Supports JSON (default), XML, and YAML
        response representations via the Accept header.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            examples: [68]
      responses:
        "200":
          description: Successfully retrieved user.
          headers:
            Vary:
              description: Indicates that the response varies by the Accept header.
              schema:
                type: string
                examples: ["Accept"]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
            application/xml:
              schema:
                $ref: "#/components/schemas/User"
            application/yaml:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "406":
          $ref: "#/components/responses/NotAcceptable"
        "500":
          $ref: "#/components/responses/ServerError"

    put:
      summary: Update an existing user
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            examples: [68]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/User"
      responses:
        "200":
          description: User updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          $ref: "#/components/responses/ServerError"

    delete:
      summary: Delete a user
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            examples: [68]
      responses:
        "204":
          description: User successfully deleted.
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          $ref: "#/components/responses/ServerError"

  /groups:
    get:
      summary: Get a list of all groups
      parameters:
        - name: name
          in: query
          description: Filter groups by name (partial match)
          required: false
          schema:
            type: string
            examples: ["Knights"]
        - name: creationDate
          in: query
          description: Filter groups by the date they were created
          required: false
          schema:
            type: string
            examples: ["2026-10-22T20:18:54Z"]
        - name: page
          in: query
          description: Filter groups by subset of queries in the db
          required: false
          schema:
            type: integer
            examples: [1, 2, 3, 4, 5]
        - name: limit
          in: query
          description: Filter the amount of groups in a page
          required: false
          schema:
            type: integer
            examples: [10]
            default: 5
      responses:
        "200":
          description: Successfully retrieved groups.
          content:
            application/json:
              schema:
                type: $ref
                items:
                  $ref: "#/components/schemas/Group"
        "400":
          $ref: "#/components/responses/BadRequest"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "406":
          $ref: "#/components/responses/NotAcceptable"
        "500":
          $ref: "#/components/responses/ServerError"

    post:
      summary: Create a new group
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Group"
      responses:
        "201":
          description: Group created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Group"
        "400":
          $ref: "#/components/responses/BadRequest"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          $ref: "#/components/responses/ServerError"

  /groups/{id}:
    get:
