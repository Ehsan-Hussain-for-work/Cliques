<!doctype html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Cliques - Admin Panel</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

    <link rel="stylesheet" href="./assets/style/style.css" />
    <script src="./assets/js/script.js" defer></script>
  </head>

  <body>
    <nav class="navbar navbar-dark bg-dark px-3 py-3">
      <div class="container-fluid">
        <a class="navbar-brand fw-bold brand" href="">
          <h1>Cliques</h1>
        </a>
      </div>
    </nav>

    <div class="container-fluid">
      <div class="row">
        <aside class="col-md-3 col-lg-2 sidebar p-3">
          <h6 class="text-uppercase text-secondary mt-3 mb-3">Section Menu</h6>

          <nav class="nav flex-column" aria-label="Main navigation">
            <a class="nav-link active" href="#users"> Users </a>
            <a class="nav-link" href="#groups"> Groups </a>
            <a class="nav-link" href="#channels"> Channels </a>
            <a class="nav-link" href="#memberships"> Memberships </a>
            <a class="nav-link" href="#messages"> Messages </a>
          </nav>
        </aside>

        <main class="col-md-9 col-lg-10 p-4">
          <section
            id="users"
            class="content-section mb-5 card border-0 shadow-sm"
          >
            <h2 class="fw-bold mb-1 card-header">User Management</h2>
            <div class="card-body">
              <div
                class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4"
              ></div>

              <div class="card border-0 shadow-sm mb-4">
                <div class="card-body">
                  <h3 class="card-subtitle mb-2">Search</h3>
                  <form id="userFilterForm">
                    <div class="row g-3 align-items-end">
                      <div class="col-md-6">
                        <input
                          type="text"
                          class="form-control"
                          id="usernameFilter"
                          name="username"
                          placeholder="Search usernames..."
                        />
                      </div>

                      <div class="col-md-3">
                        <select
                          class="form-select"
                          id="warningFilter"
                          name="warningStatus"
                        >
                          <option value="">All Users</option>
                          <option value="true">Warned</option>
                          <option value="false">Not Warned</option>
                        </select>
                      </div>

                      <div class="col-md-3">
                        <button type="submit" class="btn btn-primary me-1">
                          Search
                        </button>
                      </div>
                    </div>
                  </form>
                </div>
              </div>

              <div class="card border-0 shadow-sm">
                <div class="card-body">
                  <h3 class="card-subtitle mb-2">Registered Users</h3>
                  <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                      <thead class="table-light">
                        <tr>
                          <th scope="col">ID</th>
                          <th scope="col">Username</th>
                          <th scope="col">Email</th>
                          <th scope="col">Birthday</th>
                          <th scope="col">Warning</th>
                          <th scope="col" class="text-end">Actions</th>
                        </tr>
                      </thead>

                      <tbody id="userTableBody">
                        <tr></tr>
                      </tbody>
                    </table>
                  </div>

                  <nav
                    class="d-flex flex-wrap justify-content-center gap-3 mt-3"
                    aria-label="User page navigation"
                  >
                    <ul class="pagination">
                      <li class="page-item disabled">
                        <a class="page-link">Previous</a>
                      </li>
                      <li class="page-item">
                        <a class="page-link" href="#">1</a>
                      </li>
                      <li class="page-item">
                        <a class="page-link" href="#">2</a>
                      </li>
                      <li class="page-item">
                        <a class="page-link" href="#">3</a>
                      </li>
                      <li class="page-item">
                        <a class="page-link" href="#">Next</a>
                      </li>
                    </ul>
                  </nav>
                </div>
              </div>
              <br />
              <section id="userFormSection" class="content-section mb-5">
                <div class="card border-0 shadow-sm">
                  <div class="card-body">
                    <div
                      id="userFormFeedback"
                      class="alert d-none"
                      role="alert"
                      aria-live="assertive"
                    ></div>

                    <h3 class="card-subtitle mb-2" id="userFormHeading">
                      User Data Submission
                    </h3>

                    <form id="userForm" novalidate>
                      <input type="hidden" id="userId" name="id" />

                      <div class="mb-3">
                        <label for="userUsername" class="form-label">
                          Username
                        </label>

                        <input
                          type="text"
                          class="form-control"
                          id="userUsername"
                          name="username"
                          required
                          minlength="3"
                        />

                        <div id="usernameError" class="invalid-feedback"></div>
                      </div>

                      <div class="mb-3">
                        <label for="userEmail" class="form-label">
                          Email Address
                        </label>

                        <input
                          type="email"
                          class="form-control"
                          id="userEmail"
                          name="email"
                          required
                        />

                        <div id="emailError" class="invalid-feedback"></div>
                      </div>

                      <div class="mb-3">
                        <label for="userBirthday" class="form-label">
                          Birthday
                        </label>

                        <input
                          type="date"
                          class="form-control"
                          id="userBirthday"
                          name="userBirthday"
                        />

                        <div id="birthdayError" class="invalid-feedback"></div>
                      </div>

                      <div class="mb-4">
                        <label for="userWarningStatus" class="form-label">
                          Warning Status
                        </label>

                        <select
                          class="form-select"
                          id="userWarningStatus"
                          name="warningStatus"
                        >
                          <option value="false">Not Warned</option>

                          <option value="true">Warned</option>
                        </select>
                      </div>

                      <button type="submit" class="btn btn-primary">
                        Save User
                      </button>

                      <button
                        type="button"
                        class="btn btn-outline-secondary"
                        id="cancelUserForm"
                      >
                        Cancel
                      </button>
                    </form>
                  </div>
                </div>
              </section>
            </div>
          </section>

          <footer class="text-center text-secondary py-4">
            <small>Vanier Web Services</small>
          </footer>
        </main>
      </div>
    </div>
  </body>
</html>
